# Isolated staging only. Do not use for real financial data.
services:
  - type: web
    name: moneypilot-postgres-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: feature/postgres-persistence-v1
    dockerfilePath: ./Dockerfile.pg
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: moneypilot-postgres-test
          property: connectionString
databases:
  - name: moneypilot-postgres-test
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
